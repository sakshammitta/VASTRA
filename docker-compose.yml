version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vastra-postgres
    environment:
      POSTGRES_DB: vastra
      POSTGRES_USER: vastra
      POSTGRES_PASSWORD: vastra_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vastra -d vastra"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vastra-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vastra-backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/vastra
      DATABASE_USER: vastra
      DATABASE_PASSWORD: vastra_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: local-dev-secret-change-in-production-must-be-32-chars-min
      CV_SERVICE_URL: http://cv-service:8001
      R2_ENDPOINT: ""
      R2_ACCESS_KEY: ""
      R2_SECRET_KEY: ""
      R2_BUCKET: vastra-media
      R2_PUBLIC_URL: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  cv-service:
    build:
      context: ./cv-service
      dockerfile: Dockerfile
    container_name: vastra-cv
    ports:
      - "8001:8001"
    environment:
      R2_ENDPOINT: ""
      R2_ACCESS_KEY: ""
      R2_SECRET_KEY: ""
      R2_BUCKET: vastra-media
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
