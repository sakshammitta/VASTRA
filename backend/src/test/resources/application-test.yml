spring:
  datasource:
    url: jdbc:h2:mem:vastra_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    # none = Hibernate does not touch the schema; schema.sql creates tables instead.
    # This avoids Hibernate generating DDL that includes "vector(512)" which H2 rejects.
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      # Spring Boot runs src/test/resources/schema.sql against the embedded H2 db.
      mode: always
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

vastra:
  jwt:
    secret: test-secret-must-be-at-least-32-chars-long
    expiration-ms: 86400000
  r2:
    endpoint: ''
    access-key: ''
    secret-key: ''
    bucket: test-bucket
    public-url: ''
  cv-service:
    base-url: http://localhost:8001

management:
  endpoints:
    web:
      exposure:
        include: health
